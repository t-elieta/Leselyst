{% extends "base.html" %}

{% block title %}Create a List — Leselyst{% endblock %}

{% block content %}

<div style="max-width: 500px; margin: 2rem auto;">
    <a href="{% url 'Leselystapp:my_lists' %}" style="font-size: 0.85rem; color: var(--text-light); text-decoration: none;">← Back to my lists</a>

    <h1 style="margin: 1rem 0;">Create a new list</h1>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.85rem; font-weight: 500; display: block; margin-bottom: 0.25rem;">Title</label>
                <input type="text" name="title" required style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 3px; font-size: 0.9rem; font-family: inherit;">
            </div>
            <div style="margin-bottom: 1rem;">
                <label style="font-size: 0.85rem; font-weight: 500; display: block; margin-bottom: 0.25rem;">Description</label>
                <textarea name="description" rows="3" style="width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 3px; font-size: 0.9rem; font-family: inherit;"></textarea>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label style="font-size: 0.85rem;">
                    <input type="checkbox" name="is_public"> Make this list public
                </label>
            </div>
            <button type="submit" class="btn btn-green">Create list</button>
        </form>
    </div>
</div>

{% endblock %}
