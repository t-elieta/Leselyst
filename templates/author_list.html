{% extends "base.html" %}

{% block title %}Authors — Leselyst{% endblock %}

{% block content %}

<div style="margin-bottom: 1.5rem;">
    <h1>Authors</h1>
</div>

<div class="card-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem;">
    {% for author in authors %}
    <div class="card">
        <a href="{% url 'Leselystapp:author_detail' author_id=author.id %}" style="text-decoration: none;">
            <div style="font-family: 'Lora', serif; font-weight: 600; font-size: 0.95rem; color: var(--brown); margin-bottom: 0.25rem;">{{ author.name }}</div>
            <div style="font-size: 0.8rem; color: var(--text-light);">{{ author.books.count }} book{{ author.books.count|pluralize }}</div>
        </a>
    </div>
    {% empty %}
    <p style="color: var(--text-light);">No authors found.</p>
    {% endfor %}
</div>

{% endblock %}
