<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leselyst - Author Detail</title>
</head>
<body>
    <h1>Books by {{ author_name }}</h1>
    <ul>
        {% for book in books %}
            <li><a href="{% url 'Leselystapp:book_detail' book_id=book.id %}">{{ book.title }}</a></li>
        {% endfor %}
    </ul>
    <a href="{% url 'Leselystapp:author_list' %}">Back to Author List</a>
    <footer>
        <p>&copy; 2026 Leselyst. All rights reserved.</p>
    </footer>
</body>
</html>
